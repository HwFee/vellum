<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>傅里叶方波谐波叠加演示</title>
  <style>
    :root {
      /* kami 纸墨基础调色板 */
      --parchment: #f5f4ed;
      --ivory: #faf9f5;
      --warm-sand: #e8e6dc;
      --near-black: #141413;
      --dark-warm: #3d3d3a;
      --stone: #6b6a64;
      --brand: #1B365D;
      --brand-hover: #24477a;
      --hairline: #dddacc;
      --border: #e8e6dc;

      /* 语义色示范（可选）：图示内容允许低饱和语义色，与纸墨基调协调 */
      --pine: #2F5D50;    /* 黛绿：如计算/运行时模块 */
      --ochre: #8C5B2E;   /* 赭石：如存储/持久层模块 */

      /* 纸墨字体栈 */
      --font-serif: "TsangerJinKai02", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", Charter, Georgia, Palatino, serif;
      --font-mono: "JetBrains Mono", "SF Mono", "Fira Code", Consolas, Monaco, "TsangerJinKai02", "Source Han Serif SC", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--parchment);
      color: var(--dark-warm);
      font-family: var(--font-serif);
      font-size: 15px;
      line-height: 1.6;
      padding: 14px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 纸墨卡片容器 */
    .widget-card {
      background: var(--ivory);
      border: 1px solid var(--hairline);
      border-radius: 4px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 标题栏 */
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 8px;
    }

    .widget-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--near-black);
      letter-spacing: 0.5px;
    }

    .widget-subtitle {
      font-size: 12.5px;
      font-family: var(--font-mono);
      color: var(--stone);
    }

    /* 控制面板 */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      background: var(--parchment);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 10px 12px;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-label {
      font-size: 12.5px;
      color: var(--stone);
      display: flex;
      justify-content: space-between;
    }

    .control-value {
      font-family: var(--font-mono);
      color: var(--near-black);
      font-weight: 500;
    }

    /* 滑动条规范 */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--hairline);
      border-radius: 2px;
      outline: none;
      margin: 4px 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      background: var(--brand);
      cursor: pointer;
      border: 1px solid var(--ivory);
    }

    /* 按钮组规范 */
    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      background: var(--ivory);
      color: var(--dark-warm);
      border: 1px solid var(--hairline);
      border-radius: 2px;
      font-family: var(--font-serif);
      font-size: 12.5px;
      padding: 4px 10px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      background: var(--parchment);
      border-color: var(--stone);
    }

    .btn.active {
      background: var(--brand);
      color: var(--ivory);
      border-color: var(--brand);
    }

    /* 画布区域 */
    .canvas-container {
      position: relative;
      width: 100%;
      height: 180px;
      background: var(--ivory);
      border: 1px solid var(--hairline);
      border-radius: 3px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 底部数学公式与说明 */
    .formula-note {
      font-size: 12.5px;
      font-family: var(--font-mono);
      color: var(--stone);
      line-height: 1.4;
      background: var(--parchment);
      border-left: 2px solid var(--brand);
      padding: 6px 10px;
      border-radius: 0 2px 2px 0;
    }

    /* 动效豁免（严格遵循 kami 纸墨规范） */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="widget-card">
    <div class="widget-header">
      <span class="widget-title">方波谐波合成（Fourier Series Approximation）</span>
      <span class="widget-subtitle">N 次奇次谐波叠加</span>
    </div>

    <div class="controls-grid">
      <div class="control-item">
        <div class="control-label">
          <span>谐波项数 N</span>
          <span class="control-value" id="val-n">5</span>
        </div>
        <input type="range" id="input-n" min="1" max="15" step="1" value="5">
      </div>

      <div class="control-item">
        <div class="control-label">
          <span>角速度 (ω)</span>
          <span class="control-value" id="val-speed">1.0x</span>
        </div>
        <input type="range" id="input-speed" min="0.2" max="2.5" step="0.1" value="1.0">
      </div>

      <div class="control-item" style="justify-content: flex-end;">
        <div class="btn-group">
          <button class="btn active" id="btn-toggle">暂停演练</button>
          <button class="btn" id="btn-reset">重置初始</button>
        </div>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="wave-canvas"></canvas>
    </div>

    <div class="formula-note" id="formula-text">
      f(t) = (4/π) · ∑ [ sin((2k-1)ωt) / (2k-1) ], k ∈ [1, 5] · 吉布斯过冲峰值 ≈ +17.9%
    </div>
  </div>

  <script>
    // 1. 高度自适应与标题上报脚本（宿主契约）
    (function() {
      function report() {
        const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
        window.parent.postMessage({
          type: "vellum-widget:resize",
          height: h,
          title: document.title
        }, "*");
      }
      window.addEventListener("load", report);
      if (window.ResizeObserver) {
        new ResizeObserver(report).observe(document.body);
      }
    })();

    // 2. 纯内存状态模型（所有状态仅存于 JS 内存变量，不触碰任何浏览器持久化存储 API）
    const state = {
      n: 5,
      speed: 1.0,
      playing: true,
      phase: 0.0,
      animId: null
    };

    // DOM 元素引用
    const canvas = document.getElementById('wave-canvas');
    const ctx = canvas.getContext('2d');
    const inputN = document.getElementById('input-n');
    const valN = document.getElementById('val-n');
    const inputSpeed = document.getElementById('input-speed');
    const valSpeed = document.getElementById('val-speed');
    const btnToggle = document.getElementById('btn-toggle');
    const btnReset = document.getElementById('btn-reset');
    const formulaText = document.getElementById('formula-text');

    // 高分辨率画布适配
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }

    // 绘制主循环
    function draw() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const midY = height / 2;
      const amp = height * 0.35;

      ctx.clearRect(0, 0, width, height);

      // 1. 绘制中线与发丝网格
      ctx.beginPath();
      ctx.strokeStyle = '#dddacc'; // hairline
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.moveTo(0, midY);
      ctx.lineTo(width, midY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 2. 绘制理想方波基准（暗淡线条）
      ctx.beginPath();
      ctx.strokeStyle = '#e8e6dc'; // warm-sand
      ctx.lineWidth = 1;
      const period = width / 2;
      for (let x = 0; x < width; x++) {
        const t = (x / period) * 2 * Math.PI + state.phase;
        const ideal = Math.sin(t) >= 0 ? 1 : -1;
        const y = midY - ideal * amp;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // 3. 绘制傅里叶叠加波形（靛青色主线）
      ctx.beginPath();
      ctx.strokeStyle = '#1B365D'; // brand
      ctx.lineWidth = 1.8;
      for (let x = 0; x < width; x++) {
        const t = (x / period) * 2 * Math.PI + state.phase;
        let sum = 0;
        for (let k = 1; k <= state.n; k++) {
          const harmonic = 2 * k - 1;
          sum += Math.sin(harmonic * t) / harmonic;
        }
        const val = sum * (4 / Math.PI);
        const y = midY - val * amp;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // 状态推进
      if (state.playing) {
        state.phase += 0.02 * state.speed;
        state.animId = requestAnimationFrame(draw);
      }
    }

    // 交互监听（全在内存中响应）
    inputN.addEventListener('input', (e) => {
      state.n = parseInt(e.target.value, 10);
      valN.textContent = state.n;
      formulaText.textContent = `f(t) = (4/π) · ∑ [ sin((2k-1)ωt) / (2k-1) ], k ∈ [1, ${state.n}] · 吉布斯过冲峰值 ≈ +17.9%`;
      if (!state.playing) draw();
    });

    inputSpeed.addEventListener('input', (e) => {
      state.speed = parseFloat(e.target.value);
      valSpeed.textContent = state.speed.toFixed(1) + 'x';
    });

    btnToggle.addEventListener('click', () => {
      state.playing = !state.playing;
      if (state.playing) {
        btnToggle.textContent = '暂停演练';
        btnToggle.classList.add('active');
        state.animId = requestAnimationFrame(draw);
      } else {
        btnToggle.textContent = '继续播放';
        btnToggle.classList.remove('active');
        if (state.animId) cancelAnimationFrame(state.animId);
      }
    });

    btnReset.addEventListener('click', () => {
      state.n = 5;
      state.speed = 1.0;
      state.phase = 0.0;
      inputN.value = 5;
      valN.textContent = '5';
      inputSpeed.value = 1.0;
      valSpeed.textContent = '1.0x';
      formulaText.textContent = `f(t) = (4/π) · ∑ [ sin((2k-1)ωt) / (2k-1) ], k ∈ [1, 5] · 吉布斯过冲峰值 ≈ +17.9%`;
      if (!state.playing) {
        state.playing = true;
        btnToggle.textContent = '暂停演练';
        btnToggle.classList.add('active');
        state.animId = requestAnimationFrame(draw);
      }
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
      if (!state.playing) draw();
    });

    // 启动初始渲染
    resizeCanvas();
    state.animId = requestAnimationFrame(draw);
  </script>
</body>
</html>
