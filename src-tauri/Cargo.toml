[package]
name = "vellum"
version = "1.13.2"
description = "Vellum · 素笺 - an elegant Markdown viewer"
authors = ["Vellum · 素笺"]
edition = "2021"

[lib]
name = "vellum_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
dunce = "1"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools", "custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

# 导出为 PDF：Windows 对 WebView2 调 CDP Page.printToPDF。版本必须与 wry 的嵌套依赖
# 严格同版（webview2-com 0.38.2 / windows-core 0.61.2 / windows-sys 0.61.2），
# 否则接口类型不统一（与 katex 同版约束同理）
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-core = "0.61"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
] }

# 导出为 PDF：Linux 走 WebKitGTK 的 PrintOperation（Print to File → PDF）。
# 版本同样锁定在 wry 0.55.1 实际拉取的嵌套版本（Cargo.lock：webkit2gtk 2.0.2 /
# gtk 0.18.2）——webview.inner() 返回的就是这套类型，版本错位会让类型对不上
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
gtk = "0.18.2"

[profile.release]
# 发布配置：运行性能/体积优先，编译时间较长。
# 日常快速迭代打包可临时改为：lto = "thin"、codegen-units = 16、incremental = true
lto = true
codegen-units = 1
