<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Vellum mdlog 版式变体评审</title>
<style>
  /* ============ 公共基调（kami token） ============ */
  :root {
    --parchment:#f5f4ed; --ivory:#faf9f5; --near-black:#141413; --dark-warm:#3d3d3a;
    --stone:#6b6a64; --brand:#1B365D; --hairline:#dddacc; --vermilion:#A63A2B;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:#e9e7dd; color:var(--dark-warm);
    font-family:"TsangerJinKai02","Source Han Serif SC","Songti SC",serif;
  }
  /* ============ 顶部切换器 ============ */
  .switcher {
    position:sticky; top:0; z-index:10; display:flex; gap:8px; align-items:center;
    padding:12px 24px; background:var(--ivory); border-bottom:1px solid var(--hairline);
  }
  .switcher .label { font-size:13px; color:var(--stone); margin-right:8px; }
  .switcher button {
    font:inherit; font-size:13px; padding:6px 16px; cursor:pointer;
    border:1px solid var(--hairline); background:var(--parchment); color:var(--dark-warm); border-radius:2px;
  }
  .switcher button.on { background:var(--brand); color:var(--ivory); border-color:var(--brand); }
  .variant { display:none; }
  .variant.on { display:block; }
  .page { max-width:760px; margin:0 auto; padding:48px 40px 96px; background:var(--parchment); min-height:100vh; }

  /* ============================================================
     变体 A · 极简版式 —— 无卡片，纯版面节奏，细分隔线
     ============================================================ */
  .va .turn { margin:0 0 40px; }
  .va .who {
    font-size:12px; letter-spacing:.18em; color:var(--stone);
    margin-bottom:10px; display:flex; align-items:baseline; gap:10px;
  }
  .va .who b { font-weight:500; color:var(--near-black); }
  .va .who::after { content:""; flex:1; border-top:1px solid var(--hairline); transform:translateY(-3px); }
  .va .u { padding-left:20px; border-left:2px solid var(--brand); }
  .va .u .who b { color:var(--brand); }
  .va p { font-size:16px; line-height:1.9; margin:0 0 12px; }
  .va .fig { border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline); padding:20px 4px 12px; margin:16px 0 6px; }
  .va .cap { font-size:12.5px; color:var(--stone); text-align:center; margin-top:8px; }

  /* ============================================================
     变体 B · 卡片对话 —— 用户象牙卡片+靛青侧条，widget 带题头栏
     ============================================================ */
  .vb .turn { margin:0 0 32px; }
  .vb .u {
    background:var(--ivory); border:1px solid var(--hairline); border-left:3px solid var(--brand);
    border-radius:3px; padding:14px 18px;
  }
  .vb .who { font-size:12px; color:var(--stone); letter-spacing:.12em; margin-bottom:8px; }
  .vb .who b { font-weight:500; color:var(--brand); }
  .vb .a .who { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .vb .a .who::before { content:""; width:7px; height:7px; background:var(--brand); }
  .vb .a .who b { font-weight:500; color:var(--near-black); }
  .vb p { font-size:16px; line-height:1.9; margin:0 0 12px; }
  .vb .u p { margin:0; }
  .vb .fig { background:var(--ivory); border:1px solid var(--hairline); border-radius:4px; overflow:hidden; margin:14px 0; }
  .vb .fig .bar {
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px; color:var(--stone); letter-spacing:.08em;
    padding:8px 14px; border-bottom:1px solid var(--hairline); background:var(--parchment);
  }
  .vb .fig .body { padding:16px 14px; }

  /* ============================================================
     变体 C · 页边批注 —— 名字进左页边，正文通栏，古籍批注感
     ============================================================ */
  .vc .turn { display:grid; grid-template-columns:76px 1fr; gap:20px; margin:0 0 36px; }
  .vc .who { text-align:right; padding-top:3px; }
  .vc .who b { display:block; font-weight:500; font-size:13px; color:var(--near-black); }
  .vc .who i { font-style:normal; font-size:11px; color:var(--stone); }
  .vc .u .who b { color:var(--vermilion); }
  .vc .body { border-top:1px solid var(--hairline); padding-top:12px; }
  .vc .turn:first-child .body { border-top:none; padding-top:0; }
  .vc p { font-size:16px; line-height:1.9; margin:0 0 12px; }
  .vc .fig { border:1px solid var(--hairline); padding:18px 16px 10px; margin:14px 0 4px; background:var(--ivory); }
  .vc .cap { font-size:12.5px; color:var(--stone); text-align:right; margin-top:8px; }

  /* ============================================================
     变体 D · 书札卷轴 —— 章点起首、暖色标签、双细线框图
     ============================================================ */
  .vd .turn { margin:0 0 44px; }
  .vd .who { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .vd .who::before { content:""; width:9px; height:9px; background:var(--brand); }
  .vd .u .who::before { background:var(--vermilion); }
  .vd .who b { font-weight:500; font-size:15px; color:var(--near-black); }
  .vd .who i { font-style:normal; font-size:12px; color:var(--stone); }
  .vd .u .body {
    background:var(--ivory); padding:16px 20px;
    border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline);
  }
  .vd p { font-size:16px; line-height:1.9; margin:0 0 12px; }
  .vd .u p { margin:0; }
  .vd .fig {
    margin:16px 0 6px; padding:6px; background:var(--ivory);
    border:1px solid var(--hairline); outline:1px solid var(--hairline); outline-offset:3px;
  }
  .vd .fig .body { padding:12px 10px 4px; }
  .vd .cap { font-size:12.5px; color:var(--stone); text-align:center; padding:6px 0 4px; border-top:1px solid var(--hairline); }

  /* ============ 示例架构简图（静态 SVG，语义化配色示范） ============ */
  .arch { width:100%; height:auto; display:block; }
  .arch text { font-family:"TsangerJinKai02","Source Han Serif SC","Songti SC",serif; }
  .arch .t1 { font-size:15px; fill:#141413; font-weight:500; }
  .arch .t2 { font-size:13px; fill:#3d3d3a; }
  .arch .t3 { font-size:12px; fill:#6b6a64; }
</style>
</head>
<body>

<div class="switcher">
  <span class="label">版式变体：</span>
  <button data-v="va" class="on">A · 极简版式</button>
  <button data-v="vb">B · 卡片对话</button>
  <button data-v="vc">C · 页边批注</button>
  <button data-v="vd">D · 书札卷轴</button>
</div>

<!-- 四个变体共用同一份内容：一轮「问→答+静态架构简图」 -->
<!-- 架构 SVG 片段用 JS 注入，避免重复四份 -->

<script>
const ARCH_SVG = `
<svg class="arch" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 前端层：靛青 -->
  <rect x="40" y="18" width="560" height="72" fill="none" stroke="#1B365D" stroke-width="1.5"/>
  <text x="60" y="44" class="t1">前端 · React 19（WebView2）</text>
  <text x="60" y="68" class="t3">MarkdownDocument 懒加载 · CodeBlock PrismLight · WidgetSandbox memo+LRU</text>
  <!-- IPC：墨色虚线 -->
  <line x1="320" y1="90" x2="320" y2="118" stroke="#3d3d3a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="336" y="108" class="t3">invoke / emit</text>
  <!-- 后端层：黛绿语义色 -->
  <rect x="40" y="118" width="268" height="72" fill="none" stroke="#2F5D50" stroke-width="1.5"/>
  <text x="60" y="144" class="t1">Rust 后端 · Tauri 2</text>
  <text x="60" y="168" class="t3">read_document · watch · widget 注册表</text>
  <!-- 存储层：赭石语义色 -->
  <rect x="332" y="118" width="268" height="72" fill="none" stroke="#8C5B2E" stroke-width="1.5"/>
  <text x="352" y="144" class="t1">本地文件系统</text>
  <text x="352" y="168" class="t3">.md 文档 · mdlog-assets 图片</text>
  <!-- 底部说明 -->
  <line x1="40" y1="214" x2="600" y2="214" stroke="#dddacc" stroke-width="1"/>
  <text x="40" y="240" class="t2">数据单向流动：磁盘 → 后端 → 前端；事件反向推送热重载</text>
  <text x="40" y="264" class="t3">配色示范：靛青=界面层，黛绿=运行时，赭石=持久层（kami 基调 + 语义色）</text>
</svg>`;

const SAMPLE = {
  user: { who: "你", time: "23:03", text: "给我画一个图，展示一下整个系统的架构。" },
  assistant: {
    who: "Pi", time: "23:05",
    paras: [
      "系统分三层：前端 React 负责渲染与交互，Rust 后端负责文件读写与监听，中间以 Tauri IPC 桥接。",
      "数据单向流动：文档从磁盘经后端送前端渲染；文件变化由后端 watcher 反向推事件触发热重载。"
    ],
    cap: "图 1 · Vellum 三层架构（静态简图）"
  }
};

function figHTML(v) {
  if (v === "vb") return `<figure class="fig"><div class="bar"><span>${SAMPLE.assistant.cap}</span><span>沙箱中运行</span></div><div class="body">${ARCH_SVG}</div></figure>`;
  if (v === "vd") return `<figure class="fig"><div class="body">${ARCH_SVG}</div><div class="cap">${SAMPLE.assistant.cap}</div></figure>`;
  return `<figure class="fig">${ARCH_SVG}<figcaption class="cap">${SAMPLE.assistant.cap}</figcaption></figure>`;
}

function variantHTML(v) {
  const u = SAMPLE.user, a = SAMPLE.assistant;
  if (v === "vc") return `
    <div class="turn u"><div class="who"><b>${u.who}</b><i>${u.time}</i></div><div class="body"><p>${u.text}</p></div></div>
    <div class="turn a"><div class="who"><b>${a.who}</b><i>${a.time}</i></div><div class="body">
      ${a.paras.map(p=>`<p>${p}</p>`).join("")}${figHTML(v)}</div></div>`;
  return `
    <div class="turn u"><div class="who"><b>${u.who}</b> · ${u.time}</div><p>${u.text}</p></div>
    <div class="turn a"><div class="who"><b>${a.who}</b> · ${a.time}</div>
      ${a.paras.map(p=>`<p>${p}</p>`).join("")}${figHTML(v)}</div>`;
}

for (const v of ["va","vb","vc","vd"]) {
  const sec = document.createElement("section");
  sec.className = "variant " + v + (v === "va" ? " on" : "");
  sec.innerHTML = `<div class="page">${variantHTML(v)}</div>`;
  document.body.appendChild(sec);
}

document.querySelectorAll(".switcher button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".switcher button").forEach(b => b.classList.toggle("on", b === btn));
    document.querySelectorAll(".variant").forEach(s => s.classList.toggle("on", s.classList.contains(btn.dataset.v)));
  });
});
</script>

</body>
</html>
