<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字体选择器 · 设计稿（置景：真实设置页）</title>
<style>
/* ===== 随包字体（路径相对 docs/design/ → ../../public/fonts/） ===== */
@font-face { font-family: "TsangerJinKai02"; src: url("../../public/fonts/TsangerJinKai02-W04.woff2") format("woff2"); font-weight: 400; font-style: normal; }
@font-face { font-family: "TsangerJinKai02"; src: url("../../public/fonts/TsangerJinKai02-W05.woff2") format("woff2"); font-weight: 500; font-style: normal; }
@font-face { font-family: "JetBrains Mono"; src: url("../../public/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 400 500; font-style: normal; }

/* ===== 令牌：与 src/styles/kami.css 的 :root / dark 块逐字一致 ===== */
:root {
  --parchment: #f5f4ed; --ivory: #faf9f5; --inline-code-bg: #f0eee6;
  --warm-sand: #e8e6dc; --near-black: #141413; --dark-warm: #3d3d3a;
  --olive: #504e49; --stone: #6b6a64; --brand: #1B365D; --tag-bg: #E4ECF5;
  --brand-tint: #EEF2F7; --border: #e8e6dc; --border-soft: #e5e3d8; --hairline: #dddacc;
  --scrollbar-thumb: rgba(80, 78, 73, 0.5); --scrollbar-thumb-hover: rgba(80, 78, 73, 0.7);
  --scrim: rgba(20, 20, 19, 0.15); --shadow-soft: rgba(20, 20, 19, 0.08);
  --faint-text: #a5a294; --faint-mark: #b9b6a9; --brand-hover-tint: rgba(27, 54, 93, 0.08);
  --reader-font-size: 14px; --reader-column-width: 800px; --reader-line-height: 1.55;
  --font-cjk-tail: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", Charter, Georgia, Palatino;
  --font-cjk: "TsangerJinKai02", var(--font-cjk-tail);
  --font-latin: var(--font-cjk);
  --font-mono-tail: "SF Mono", "Fira Code", Consolas, Monaco, "TsangerJinKai02", "Source Han Serif SC";
  --font-mono: "JetBrains Mono", var(--font-mono-tail);
  --serif: var(--font-latin), var(--font-cjk), serif;
  --mono: var(--font-mono), monospace;
}
:root[data-theme="dark"] {
  --parchment: #1c1b19; --ivory: #242320; --inline-code-bg: #2a2926;
  --warm-sand: #33312c; --near-black: #e8e6dc; --dark-warm: #cfccc0;
  --olive: #b3b0a4; --stone: #8f8c82; --brand: #8fb0d9; --tag-bg: #25303f;
  --brand-tint: #1f2733; --border: #34322d; --border-soft: #2f2d29; --hairline: #3d3b35;
  --scrollbar-thumb: rgba(232, 230, 220, 0.28); --scrollbar-thumb-hover: rgba(232, 230, 220, 0.45);
  --scrim: rgba(0, 0, 0, 0.4); --shadow-soft: rgba(0, 0, 0, 0.35);
  --faint-text: #6a675c; --faint-mark: #57544b; --brand-hover-tint: rgba(143, 176, 217, 0.14);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--warm-sand);
  color: var(--near-black);
  font-family: var(--serif);
  font-size: 14px; line-height: 1.55; letter-spacing: 0.3pt;
  -webkit-font-smoothing: antialiased;
}

/* ===== 方案切换条（页面级，不属于窗口） ===== */
.switcher {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 18px;
  padding: 10px 20px;
  background: color-mix(in srgb, var(--warm-sand) 88%, var(--ivory));
  border-bottom: 1px solid var(--hairline);
}
.switcher .pick { display: flex; gap: 2px; }
.switcher .pick button {
  min-width: 34px; padding: 3px 10px; border: 0; border-radius: 4px;
  background: transparent; color: var(--stone); font: 500 12px/1.5 var(--serif); cursor: pointer;
}
.switcher .pick button:hover { background: var(--ivory); color: var(--dark-warm); }
.switcher .pick button[aria-pressed="true"] { background: var(--brand-tint); color: var(--brand); }
.switcher .why { color: var(--stone); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.theme-toggle { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.theme-toggle button { border: 0; background: transparent; color: var(--stone); font: 500 12px/1.5 var(--serif); padding: 4px 14px; cursor: pointer; }
.theme-toggle button[aria-pressed="true"] { background: var(--ivory); color: var(--near-black); }

/* ===== 窗口置景（~980×760，静态顶栏 + 可滚动正文） ===== */
.stage { display: flex; justify-content: center; padding: 28px 16px 80px; }
.frame {
  position: relative;
  width: 980px; height: 760px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--parchment);
  box-shadow: 0 12px 40px var(--shadow-soft);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.frame__topbar {
  flex: none; height: 46px;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  padding: 0 0 0 16px;
  border-bottom: 1px solid var(--border-soft);
  background: color-mix(in srgb, var(--parchment) 94%, var(--ivory));
}
.tb-actions { display: flex; align-items: center; gap: 6px; padding: 6px 0; }
.tb-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border: 0; border-radius: 6px;
  background: transparent; color: var(--stone);
  box-shadow: inset 0 0 0 1px var(--hairline);
  font-size: 13px;
}
.tb-divider { width: 1px; height: 16px; background: var(--hairline); margin: 0 2px; }
.tb-win { display: flex; align-items: center; gap: 0; height: 46px; }
.tb-win span {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; margin-right: 8px; border-radius: 6px;
  box-shadow: inset 0 0 0 1px var(--border); color: var(--stone);
  font: 500 10px/1 var(--mono);
}
.frame__body { flex: 1; min-height: 0; overflow-y: auto; background: var(--parchment); }
.doc-settings { padding: 18px 34px 44px; }

/* ===== 设置页真实样式（逐字摘自 kami.css） ===== */
.settings-view { max-width: 640px; margin: 0 auto; }
.settings-view__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.settings-view__note, .settings-view__value {
  font: 500 10px/1.5 var(--mono); letter-spacing: 0.4px; color: var(--stone);
}
.empty-eyebrow {
  color: var(--stone); font: 500 10px/1.5 var(--mono); letter-spacing: 4px; text-transform: uppercase;
}
.settings-view__section { margin-top: 28px; }
.settings-view__eyebrow { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.settings-view__eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }
.settings-view__row {
  display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 10px 0;
}
.settings-view__row + .settings-view__row { border-top: 1px solid var(--border-soft); }
.settings-view__label { flex: none; color: var(--near-black); }
/* 字体行的面板锚点：浮层直接钉进 .fp-row 里（跟随滚动/字体回排自动对齐），
   展开的那行抬 z-index 让面板压在后续行之上 */
.fp-row { position: relative; }
.fp-row.is-open { z-index: 60; }
/* 浮层的定位基准就是触发器自身：fp-anchor 紧贴触发器尺寸，面板 4px 缝贴其下缘、右缘对齐 */
.fp-anchor { position: relative; }
.settings-view__path {
  font: 500 10px/1.5 var(--mono); letter-spacing: 0.4px; color: var(--stone);
  word-break: break-all; text-align: right;
}
.settings-view__proof {
  margin: 10px 0 4px; padding: 20px 24px;
  border: 1px solid var(--border); border-radius: 6px; background: var(--ivory);
}
.settings-view__proof-tag {
  margin-bottom: 12px; font: 500 10px/1.5 var(--mono); letter-spacing: 4px;
  color: var(--stone); text-transform: uppercase;
}
.settings-view__proof-tag .preview-hint { color: var(--brand); letter-spacing: 2px; }
.settings-view__proof-sheet {
  margin: 0 auto; max-width: var(--reader-column-width, 800px);
  font-size: var(--reader-font-size, 14px); line-height: var(--reader-line-height, 1.55);
  transition: font-size 0.18s ease, max-width 0.18s ease;
}
.settings-view__proof-latin { margin-top: 6px; color: var(--olive); }
.settings-view__proof-sheet code {
  padding: 1px 5px; border-radius: 3px; background: var(--inline-code-bg);
  font-family: var(--mono); font-size: 12px;
}
.segments { display: flex; gap: 2px; }
.seg {
  min-width: 34px; padding: 3px 7px; border: 0; border-radius: 4px;
  background: transparent; color: var(--stone);
  font-family: var(--serif); font-size: 12px; cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.seg:hover { background: var(--warm-sand); color: var(--dark-warm); }
.seg[aria-pressed="true"] { background: var(--brand-tint); color: var(--brand); }
.text-button {
  padding: 2px 0; border: 0; background: transparent; color: var(--brand);
  font-size: 12px; cursor: pointer; transition: color 0.15s ease;
}
.text-button:hover { text-decoration: underline; text-underline-offset: 3px; }
.button.button-ghost {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px;
  border: 0; border-radius: 6px; background: transparent; color: var(--stone);
  box-shadow: inset 0 0 0 1px var(--hairline); font-size: 13px; letter-spacing: 0.3pt;
  cursor: pointer; transition: background 0.12s ease, color 0.12s ease;
}
.button.button-ghost:hover { background: var(--warm-sand); color: var(--brand); }
.button.button-primary {
  height: 32px; padding: 7px 16px; border: 0; border-radius: 6px;
  background: var(--warm-sand); color: var(--dark-warm);
  box-shadow: inset 0 0 0 1px var(--hairline); cursor: pointer;
  font-weight: 500; font-size: 13px;
  transition: background 0.15s ease, box-shadow 0.15s ease;
}
.outline-search__kbd {
  flex-shrink: 0; font: 500 9px/1 var(--mono); color: var(--stone);
  background: var(--parchment); border: 1px solid var(--border); border-radius: 3px; padding: 2px 4px;
}
.settings-view__row--keys > .settings-view__label { align-self: flex-start; padding-top: 8px; }
.settings-view__shortcuts .settings-view__row { padding: 7px 0; }
.settings-view__shortcuts { display: flex; flex-direction: column; }
.settings-view__keys { display: inline-flex; gap: 4px; }

/* ===== 方案 0 · 现状（真实 .font-picker CSS 逐字复制；fixed→absolute 锚定在窗口内） ===== */
.font-picker__value {
  max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: 500 12px/1.5 var(--mono); letter-spacing: 0.2px; color: var(--olive);
  padding: 5px 10px; border: 0; border-radius: 4px; background: transparent;
  box-shadow: inset 0 0 0 1px var(--hairline); cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.font-picker__value:hover { background: var(--warm-sand); color: var(--near-black); }
.font-picker__panel {
  position: absolute; top: calc(100% + 4px); right: 0; z-index: 965;
  display: flex; flex-direction: column;
  width: 320px; max-height: 340px; padding: 8px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--ivory); box-shadow: 0 8px 24px var(--shadow-soft);
}
.font-picker__search {
  flex: none; width: 100%; margin-bottom: 6px; padding: 6px 9px;
  border: 1px solid var(--border); border-radius: 4px;
  background: var(--parchment); color: var(--near-black); font: 12px/1.5 var(--serif);
  outline: none;
}
.font-picker__list { flex: 1; min-height: 0; margin: 0; padding: 0; overflow-y: auto; list-style: none; }
.font-picker__option {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  width: 100%; padding: 6px 8px; border: 0; border-radius: 4px;
  background: transparent; color: var(--near-black); text-align: left; cursor: pointer;
}
.font-picker__option:hover { background: var(--brand-tint); }
.font-picker__option[aria-selected="true"] { color: var(--brand); }
.font-picker__option--active { background: var(--brand-hover-tint); }
.font-picker__option-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.font-picker__option-tag { flex: none; font: 500 10px/1.5 var(--mono); letter-spacing: 0.4px; color: var(--stone); }
.font-picker__empty { padding: 10px 8px; color: var(--stone); font-size: 12px; }

/* ===== A–D 共享：与行内控件同节奏的触发器 ===== */
.fp-trigger {
  display: inline-flex; align-items: center; gap: 8px;
  min-width: 200px; max-width: 260px; height: 30px; padding: 0 4px 0 12px;
  border: 0; border-radius: 5px; background: transparent;
  box-shadow: inset 0 0 0 1px var(--hairline);
  color: var(--near-black); font-family: var(--serif); font-size: 13.5px;
  letter-spacing: 0.2px; text-align: left; cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.fp-trigger:hover { background: var(--warm-sand); }
.fp-trigger .fp-trigger__name {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.fp-trigger .fp-trigger__name.is-default { color: var(--stone); }
.fp-trigger .chev { flex: none; color: var(--faint-text); margin-right: 4px; }

/* 浮层面板基座（A / B / C）：宽度咬合触发器，贴其下缘右侧对齐 */
.fp-float {
  position: absolute; top: calc(100% + 4px); right: 0; z-index: 965;
  display: flex; flex-direction: column;
  width: 256px; max-height: 262px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--ivory); box-shadow: 0 8px 24px var(--shadow-soft);
  overflow: hidden;
}
.fp-float__search {
  flex: none; width: 100%; border: 0; border-bottom: 1px solid var(--hairline);
  padding: 8px 12px 7px; background: transparent; color: var(--near-black);
  font: 12px/1.5 var(--serif); outline: none;
}
.fp-float__search::placeholder { color: var(--faint-text); }
.fp-float__list { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 3px 5px; }
.fp-float__group {
  padding: 8px 9px 2px;
  font: 500 9.5px/1.5 var(--mono); letter-spacing: 3px; color: var(--faint-text);
}
.fp-float__option {
  display: flex; align-items: center; gap: 8px; width: 100%;
  min-height: 30px; padding: 4px 9px;
  border: 0; border-radius: 4px; background: transparent;
  color: var(--near-black); text-align: left; cursor: pointer; font-family: var(--serif);
}
.fp-float__option:hover { background: var(--brand-tint); }
.fp-float__option--active { background: var(--brand-hover-tint); }
.fp-float__empty { padding: 10px 12px; color: var(--stone); font-size: 12px; }
.fp-float__meta {
  flex: none; border-top: 1px solid var(--hairline); padding: 6px 12px;
  font: 9.5px/1.5 var(--mono); letter-spacing: 0.3px; color: var(--faint-text);
}

/* A：行内样字只给高亮行（窄列不下双份字面的账） */
.fpA__name { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fpA__sample { flex: none; max-width: 45%; font-size: 12px; color: var(--stone); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fpA__option[aria-selected="true"] .fpA__name { color: var(--brand); font-weight: 500; }
.fpA__option .fpA__sample { visibility: hidden; }
.fpA__option--active .fpA__sample,
.fpA__option[aria-selected="true"] .fpA__sample { visibility: visible; }

/* C：✓ 勾 + 仅「随包」小签 */
.fpC__check { flex: none; width: 12px; color: var(--brand); font-size: 12px; visibility: hidden; }
.fpC__option[aria-selected="true"] .fpC__check { visibility: visible; }
.fpC__name { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fpC__tag { flex: none; font: 500 9px/1.5 var(--mono); letter-spacing: 0.4px; color: var(--faint-text); }

/* ===== D · 行内展开（与应用一致的技法：grid 0fr↔1fr，不量高；内层定高+containment；
   收起 160ms ease-in 配淡出，展开 220ms ease-out） ===== */
.fpD__region {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.16s ease-in;
}
.fpD__region--open {
  grid-template-rows: 1fr;
  transition: grid-template-rows 0.22s ease-out;
}
.fpD__inner {
  /* 参与 0fr↔1fr 的层零 padding/零 border——留白下沉到 fpD__pad，随轨道一起被裁 */
  min-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.14s ease-in;
}
.fpD__pad { padding: 10px 0 12px; border-top: 1px dashed var(--hairline); }
.fpD__region--open .fpD__inner {
  opacity: 1;
  transition: opacity 0.18s ease-out 0.04s;
}
/* 收起完成落位：常驻 DOM，仅不可见+不占焦点（无布局变化） */
.fpD__region--rested { visibility: hidden; }
.fpD__search {
  width: 100%; border: 0; border-bottom: 1px solid var(--hairline);
  padding: 4px 2px 8px; margin-bottom: 6px; background: transparent;
  color: var(--near-black); font: 12.5px/1.5 var(--serif); outline: none;
}
.fpD__search::placeholder { color: var(--faint-text); }
.fpD__scroll { height: 176px; overflow-y: auto; contain: strict; }
.fpD__group {
  padding: 9px 2px 5px;
  font: 500 9.5px/1.5 var(--mono); letter-spacing: 3px; color: var(--faint-text);
}
.fpD__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.fpD__chip {
  min-height: 32px; padding: 4px 10px; border: 0; border-radius: 5px;
  background: transparent; color: var(--near-black);
  font-size: 13.5px; text-align: left; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.fpD__chip:hover { background: var(--warm-sand); }
.fpD__chip--active { background: var(--brand-hover-tint); }
.fpD__chip[aria-selected="true"] { background: var(--brand-tint); color: var(--brand); }
.fpD__empty { padding: 8px 2px; color: var(--stone); font-size: 12px; }
</style>
</head>
<body>

<div class="switcher">
  <div class="pick" role="group" aria-label="方案">
    <button data-v="0" aria-pressed="false">0 现状</button>
    <button data-v="A" aria-pressed="true">A</button>
    <button data-v="B" aria-pressed="false">B</button>
    <button data-v="C" aria-pressed="false">C</button>
    <button data-v="D" aria-pressed="false">D</button>
  </div>
  <div class="why" id="why"></div>
  <div class="theme-toggle" role="group" aria-label="主题">
    <button id="theme-light" aria-pressed="true">浅色</button>
    <button id="theme-dark" aria-pressed="false">深色</button>
  </div>
</div>

<div class="stage">
  <div class="frame">
    <div class="frame__topbar">
      <div class="tb-actions">
        <span class="tb-btn">☰</span><span class="tb-btn">‹</span><span class="tb-btn">›</span><span class="tb-btn">✎</span><span class="tb-btn">＋</span><span class="tb-btn">⤓</span>
        <span class="tb-divider"></span>
        <span class="tb-btn" style="background:var(--warm-sand);color:var(--brand)">⚙</span>
      </div>
      <div></div>
      <div class="tb-win"><span>—</span><span>▢</span><span>✕</span></div>
    </div>
    <div class="frame__body" id="frame-body">
      <div class="doc-settings">
        <div class="settings-view">

          <div class="settings-view__head">
            <button type="button" class="button button-ghost">‹ 返回阅读</button>
            <span class="settings-view__note">ESC · 改动即存</span>
          </div>

          <section class="settings-view__section" id="sec-reading">
            <span class="empty-eyebrow settings-view__eyebrow">阅读</span>
            <div class="settings-view__row">
              <span class="settings-view__label">正文字号</span>
              <div class="segments" role="group" aria-label="正文字号">
                <button class="seg">13</button><button class="seg" aria-pressed="true">14</button><button class="seg">16</button><button class="seg">18</button>
              </div>
            </div>
            <div class="settings-view__row">
              <span class="settings-view__label">栏宽</span>
              <div class="segments" role="group" aria-label="栏宽">
                <button class="seg">720</button><button class="seg" aria-pressed="true">800</button><button class="seg">960</button>
              </div>
            </div>
            <div class="settings-view__row">
              <span class="settings-view__label">行高</span>
              <div class="segments" role="group" aria-label="行高">
                <button class="seg">1.5</button><button class="seg" aria-pressed="true">1.55</button><button class="seg">1.7</button>
              </div>
            </div>

            <!-- 三槽字体行：方案由 JS 按当前变体重绘 -->
            <div class="fp-row" data-slot="cjk"></div>
            <div class="fp-row" data-slot="latin"></div>
            <div class="fp-row" data-slot="mono"></div>

            <div class="settings-view__row">
              <span class="settings-view__label">Ctrl + 滚轮改字号</span>
              <div class="segments" role="group" aria-label="Ctrl + 滚轮改字号">
                <button class="seg" aria-pressed="true">开</button><button class="seg">关</button>
              </div>
            </div>

            <div class="settings-view__proof" id="proof">

<script>
/* ===== 数据 ===== */
const FONTS = [
  { name: "TsangerJinKai02", bundled: true, cjk: true },
  { name: "JetBrains Mono", bundled: true, mono: true },
  { name: "微软雅黑", cjk: true }, { name: "Microsoft YaHei UI", cjk: true },
  { name: "宋体", cjk: true }, { name: "新宋体", cjk: true, mono: true },
  { name: "SimSun-ExtB", cjk: true }, { name: "黑体", cjk: true },
  { name: "楷体", cjk: true }, { name: "KaiTi", cjk: true },
  { name: "仿宋", cjk: true }, { name: "FangSong", cjk: true },
  { name: "等线", cjk: true }, { name: "DengXian", cjk: true },
  { name: "隶书", cjk: true }, { name: "幼圆", cjk: true },
  { name: "Source Han Serif SC", cjk: true }, { name: "Source Han Sans SC", cjk: true },
  { name: "Noto Serif SC", cjk: true }, { name: "Noto Sans SC", cjk: true },
  { name: "Yu Gothic", cjk: true }, { name: "MS Gothic", cjk: true, mono: true },
  { name: "Microsoft JhengHei", cjk: true }, { name: "PMingLiU", cjk: true },
  { name: "DFKai-SB", cjk: true },
  { name: "Georgia" }, { name: "Times New Roman" }, { name: "Palatino Linotype" },
  { name: "Book Antiqua" }, { name: "Garamond" }, { name: "Cambria" },
  { name: "Constantia" }, { name: "Arial" }, { name: "Segoe UI" },
  { name: "Calibri" }, { name: "Tahoma" }, { name: "Verdana" },
  { name: "Trebuchet MS" }, { name: "Century Gothic" }, { name: "Franklin Gothic Book" },
  { name: "Consolas", mono: true }, { name: "Cascadia Code", mono: true },
  { name: "Cascadia Mono", mono: true }, { name: "Courier New", mono: true },
  { name: "Lucida Console", mono: true },
];
const GROUPS = [
  { id: "bundled", label: "随包", test: (f) => !!f.bundled },
  { id: "cjk", label: "中文", test: (f) => !!f.cjk },
  { id: "latin", label: "西文", test: (f) => !f.cjk && !f.mono },
  { id: "mono", label: "等宽", test: (f) => !!f.mono },
];
const groupOf = (f) => GROUPS.find((g) => g.test(f));
const grouped = (list) =>
  GROUPS.map((g) => ({ label: g.label, fonts: list.filter((f) => groupOf(f) === g) })).filter((g) => g.fonts.length);
const tagOf = (f) => (f.bundled ? "随包" : f.mono ? "等宽" : f.cjk ? "中文" : "西文");
const DEFAULTS = { cjk: "默认 · 倉頡楷體", latin: "默认 · 跟随中文", mono: "默认 · JetBrains Mono" };
const SAMPLES = { cjk: "永和九年", latin: "Aa Gg 012", mono: "{ } => 0O" };
const SHORTCUTS = [
  ["切换大纲", ["CTRL", "B"]], ["聚焦搜索", ["CTRL", "K / F"]], ["全库检索", ["CTRL", "SHIFT", "F"]],
  ["打开文件", ["CTRL", "O"]], ["就地编辑", ["CTRL", "E"]], ["提交保存", ["CTRL", "S"]],
  ["导出为 PDF", ["CTRL", "P"]], ["放大字号", ["CTRL", "="]], ["缩小字号", ["CTRL", "-"]],
  ["后退·前进", ["ALT", "←", "→"]], ["专注模式", ["F11"]],
];

const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const face = (name) => `font-family: '${esc(name)}';`;
const filtered = (q) => {
  const s = q.trim().toLowerCase();
  return s === "" ? FONTS : FONTS.filter((f) => f.name.toLowerCase().includes(s));
};
const CHEV = `<svg class="chev" width="9" height="9" viewBox="0 0 9 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1.5 3l3 3 3-3"/></svg>`;

/* 快捷键一览 */
document.getElementById("shortcut-list").innerHTML = SHORTCUTS.map(([label, keys]) =>
  `<div class="settings-view__row"><span class="settings-view__value">${label}</span><span class="settings-view__keys">${keys.map((k) => `<kbd class="outline-search__kbd">${k}</kbd>`).join("")}</span></div>`
).join("");

/* ===== 每槽一个状态；当前值 ===== */
const slotState = {
  cjk: { value: "" },
  latin: { value: "" },
  mono: { value: "" },
};

const frame = document.querySelector(".frame");
const frameBody = document.getElementById("frame-body");
const proofCjk = document.getElementById("proof-cjk");
const proofLatin = document.getElementById("proof-latin");
const proofMono = document.getElementById("proof-mono");
const proofHint = document.getElementById("proof-hint");
const SLOT_LABEL = { cjk: "中文字体", latin: "西文字体", mono: "代码字体" };

/* 样张预览/落笔：B 用悬停预览（hover 换字、提示「预览中」）；A/C/D 的确认也写同一处——
   对应真机里 --font-* 写进 documentElement 的那条路 */
function proofPreview(slot, name) {
  const map = { cjk: proofCjk, latin: proofLatin, mono: proofMono };
  for (const [s, el] of Object.entries(map)) el.style.fontFamily = "";
  if (name) map[slot].style.fontFamily = `"${name}"`;
  proofHint.style.display = name ? "" : "none";
}
function applyToProof(slot, name) {
  const map = { cjk: proofCjk, latin: proofLatin, mono: proofMono };
  map[slot].style.fontFamily = name ? `"${name}"` : "";
  proofHint.style.display = "none";
}

let currentVariant = "A";
const openPanels = new Map(); // slot -> {close()}

/* ---------- 触发器（A–D 共用造型；0 用现有 .font-picker__value） ---------- */
function paintTrigger(rowEl, slot) {
  const v = slotState[slot].value;
  const label = v || DEFAULTS[slot];
  if (currentVariant === "0") {
    rowEl.querySelector(".fp-anchor").innerHTML =
      `<button class="font-picker__value" type="button" aria-haspopup="listbox">${esc(label)}</button>`;
  } else {
    const style = v ? ` style="${face(v)}"` : "";
    rowEl.querySelector(".fp-anchor").innerHTML =
      `<button class="fp-trigger" type="button" aria-haspopup="listbox"><span class="fp-trigger__name${v ? "" : " is-default"}"${style}>${esc(label)}</span>${CHEV}</button>`;
  }
}


function bindKeys(searchEl, state, commit) {
  const paint = () => {
    const rows = state.rows || [];
    rows.forEach((r, i) => r.el.classList.toggle(r.activeClass, i === state.active));
    const r = rows[state.active];
    if (r) r.el.scrollIntoView({ block: "nearest" });
    return r;
  };
  searchEl.addEventListener("keydown", (e) => {
    const rows = state.rows || [];
    if (e.key === "ArrowDown") { e.preventDefault(); state.active = Math.min(state.active + 1, rows.length - 1); const r = paint(); if (r && state.onActive) state.onActive(r.name); }
    else if (e.key === "ArrowUp") { e.preventDefault(); state.active = Math.max(state.active - 1, 0); const r = paint(); if (r && state.onActive) state.onActive(r.name); }
    else if (e.key === "Enter") { const r = rows[state.active]; if (r) commit(r.name); }
    else if (e.key === "Escape") { e.preventDefault(); state.onEscape(); }
  });
  return paint;
}

/* ---------- 渲染器 ---------- */
function renderPanel0(slot, host, done) {
  const state = { query: "", active: 0 };
  const panel = document.createElement("div");
  panel.className = "font-picker__panel";
  panel.setAttribute("role", "listbox");
  panel.innerHTML = `<input class="font-picker__search" type="search" placeholder="搜索字体…"><ul class="font-picker__list"></ul>`;
  const searchEl = panel.querySelector("input");
  const listEl = panel.querySelector("ul");
  const rerender = () => {
    const fonts = filtered(state.query);
    listEl.innerHTML = "";
    const rows = [];
    if (state.query === "" || DEFAULTS[slot].toLowerCase().includes(state.query.trim().toLowerCase())) {
      const li = document.createElement("li");
      li.innerHTML = `<button type="button" class="font-picker__option" role="option" aria-selected="${slotState[slot].value === ""}"><span class="font-picker__option-name">${DEFAULTS[slot]}</span><span class="font-picker__option-tag">默认</span></button>`;
      const b = li.firstChild;
      b.onclick = () => { slotState[slot].value = ""; done(); };
      listEl.appendChild(li);
      rows.push({ el: b, name: "", activeClass: "font-picker__option--active" });
    }
    fonts.forEach((f) => {
      const li = document.createElement("li");
      li.innerHTML = `<button type="button" class="font-picker__option" role="option" aria-selected="${f.name === slotState[slot].value}"><span class="font-picker__option-name" style="${face(f.name)}">${esc(f.name)}</span><span class="font-picker__option-tag">${tagOf(f)}</span></button>`;
      const b = li.firstChild;
      b.onclick = () => { slotState[slot].value = f.name; done(); };
      listEl.appendChild(li);
      rows.push({ el: b, name: f.name, activeClass: "font-picker__option--active" });
    });
    state.rows = rows;
    rows.forEach((r, i) => (r.el.onmouseenter = () => { state.active = i; paint(); }));
    paint();
  };
  const paint = bindKeys(searchEl, state, (name) => { slotState[slot].value = name; done(); });
  state.onEscape = () => done();
  searchEl.addEventListener("input", () => { state.query = searchEl.value; state.active = 0; rerender(); });
  host.appendChild(panel);
  rerender();
  return panel;
}

/* A：分组 + 高亮行样字 + 底部 meta */
function renderPanelA(slot, host, done) {
  const state = { query: "", active: 0 };
  const panel = document.createElement("div");
  panel.className = "fp-float";
  panel.setAttribute("role", "listbox");
  panel.innerHTML = `<input class="fp-float__search" type="search" placeholder="搜索字体"><div class="fp-float__list"></div><div class="fp-float__meta"></div>`;
  const searchEl = panel.querySelector("input");
  const listEl = panel.querySelector(".fp-float__list");
  const metaEl = panel.querySelector(".fp-float__meta");
  const rerender = () => {
    const fonts = filtered(state.query);
    listEl.innerHTML = "";
    const rows = [];
    const push = (name, label, sample, tag) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "fp-float__option fpA__option";
      b.setAttribute("role", "option");
      b.setAttribute("aria-selected", String(name === slotState[slot].value));
      b.innerHTML = `<span class="fpA__name"${name ? ` style="${face(name)}"` : ""}>${esc(label)}</span>${sample ? `<span class="fpA__sample" style="${face(name)}">${sample}</span>` : `<span class="fpA__sample" style="font:500 9.5px/1.5 var(--mono);visibility:visible;">${tag}</span>`}`;
      const idx = rows.length;
      b.onclick = () => { slotState[slot].value = name; done(); };
      b.onmouseenter = () => { state.active = idx; paint(); };
      listEl.appendChild(b);
      rows.push({ el: b, name, activeClass: "fp-float__option--active" });
    };
    if (state.query === "" || DEFAULTS[slot].toLowerCase().includes(state.query.trim().toLowerCase()))
      push("", DEFAULTS[slot], "", "默认");
    for (const g of grouped(fonts)) {
      const h = document.createElement("div");
      h.className = "fp-float__group"; h.textContent = g.label;
      listEl.appendChild(h);
      for (const f of g.fonts) push(f.name, f.name, SAMPLES[slot] || SAMPLE_CJK, tagOf(f));
    }
    if (!fonts.length) listEl.innerHTML += `<div class="fp-float__empty">没有匹配「${esc(state.query)}」的字体</div>`;
    metaEl.textContent = `${fonts.length} 款 · ↑↓ 选择 · ↵ 确认 · Esc 关闭`;
    state.rows = rows;
    paint();
  };
  const paint = bindKeys(searchEl, state, (name) => { slotState[slot].value = name; done(); });
  state.onEscape = () => done();
  searchEl.addEventListener("input", () => { state.query = searchEl.value; state.active = 0; rerender(); });
  host.appendChild(panel);
  rerender();
  return panel;
}

/* C（也是 B 的列表壳）：✓ + 仅随包签；B 复用时 hover 驱动样张预览 */
function renderPanelC(slot, host, done, opts = {}) {
  const state = { query: "", active: 0 };
  const panel = document.createElement("div");
  panel.className = "fp-float";
  panel.setAttribute("role", "listbox");
  panel.innerHTML = `<input class="fp-float__search" type="search" placeholder="搜索字体"><div class="fp-float__list"></div>`;
  const searchEl = panel.querySelector("input");
  const listEl = panel.querySelector(".fp-float__list");
  const rerender = () => {
    const fonts = filtered(state.query);
    listEl.innerHTML = "";
    const rows = [];
    const push = (name, label) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "fp-float__option fpC__option";
      b.setAttribute("role", "option");
      b.setAttribute("aria-selected", String(name === slotState[slot].value));
      const f = name ? FONTS.find((x) => x.name === name) : null;
      b.innerHTML = `<span class="fpC__check">✓</span><span class="fpC__name"${name ? ` style="${face(name)}"` : ""}>${esc(label)}</span>${f && f.bundled ? `<span class="fpC__tag">随包</span>` : name === "" ? `<span class="fpC__tag">默认</span>` : ""}`;
      const idx = rows.length;
      b.onclick = () => { slotState[slot].value = name; done(); };
      if (opts.dblCommit) b.ondblclick = () => { slotState[slot].value = name; done(); };
      b.onmouseenter = () => { state.active = idx; paint(); };
      listEl.appendChild(b);
      rows.push({ el: b, name, activeClass: "fp-float__option--active" });
    };
    if (state.query === "" || DEFAULTS[slot].toLowerCase().includes(state.query.trim().toLowerCase()))
      push("", DEFAULTS[slot]);
    for (const f of fonts) push(f.name, f.name);
    if (!fonts.length) listEl.innerHTML += `<div class="fp-float__empty">没有匹配「${esc(state.query)}」的字体</div>`;
    state.rows = rows;
    paint();
  };
  const commit = (name) => { slotState[slot].value = name; done(); };
  const paint = bindKeys(searchEl, state, (name) => {
    if (opts.previewMode) { slotState[slot].value = name; done(); } else commit(name);
  });
  state.onEscape = () => done();
  state.onActive = opts.onActive;
  searchEl.addEventListener("input", () => { state.query = searchEl.value; state.active = 0; rerender(); });
  host.appendChild(panel);
  rerender();
  return panel;
}

/* D：行内展开区 */
function renderRegionD(slot, rowEl, done) {
  // 已建过就复用（常驻 DOM）：摘掉 rested/inert，重开过渡
  const existing = rowEl.nextElementSibling;
  if (existing && existing.classList.contains("fpD__region")) {
    existing.classList.remove("fpD__region--rested");
    existing.removeAttribute("inert");
    requestAnimationFrame(() => existing.classList.add("fpD__region--open"));
    existing.querySelector("input").focus();
    return existing;
  }
  const region = document.createElement("div");
  region.className = "fpD__region";
  const inner = document.createElement("div");
  inner.className = "fpD__inner";
  inner.innerHTML = `<div class="fpD__pad"><input class="fpD__search" type="search" placeholder="搜索字体"><div class="fpD__scroll"><div class="fpD__list"></div></div></div>`;
  region.appendChild(inner);
  rowEl.after(region);
  const state = { query: "", active: 0 };
  const searchEl = inner.querySelector("input");
  const listEl = inner.querySelector(".fpD__list");
  const rerender = () => {
    const fonts = filtered(state.query);
    listEl.innerHTML = "";
    const rows = [];
    const push = (container, name, label) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "fpD__chip";
      b.setAttribute("role", "option");
      b.setAttribute("aria-selected", String(name === slotState[slot].value));
      if (name) b.style.fontFamily = `"${name}"`;
      b.textContent = label;
      const idx = rows.length;
      b.onclick = () => { slotState[slot].value = name; done(); };
      b.onmouseenter = () => { state.active = idx; paint(); };
      container.appendChild(b);
      rows.push({ el: b, name, activeClass: "fpD__chip--active" });
    };
    if (state.query === "" || DEFAULTS[slot].toLowerCase().includes(state.query.trim().toLowerCase())) {
      const gh = document.createElement("div");
      gh.className = "fpD__group"; gh.textContent = "默认";
      listEl.appendChild(gh);
      const grid = document.createElement("div");
      grid.className = "fpD__grid";
      listEl.appendChild(grid);
      push(grid, "", DEFAULTS[slot]);
    }
    for (const g of grouped(fonts)) {
      const h = document.createElement("div");
      h.className = "fpD__group"; h.textContent = g.label;
      listEl.appendChild(h);
      const grid = document.createElement("div");
      grid.className = "fpD__grid";
      listEl.appendChild(grid);
      for (const f of g.fonts) push(grid, f.name, f.name);
    }
    if (!fonts.length) listEl.innerHTML += `<div class="fpD__empty">没有匹配「${esc(state.query)}」的字体</div>`;
    state.rows = rows;
    paint();
  };
  const paint = bindKeys(searchEl, state, (name) => { slotState[slot].value = name; done(); });
  state.onEscape = () => done();
  searchEl.addEventListener("input", () => { state.query = searchEl.value; state.active = 0; rerender(); });
  rerender();
  // 高度交给 grid-template-rows：挂上去时 0fr，下一帧加 --open → 1fr
  requestAnimationFrame(() => region.classList.add("fpD__region--open"));
  return region;
}

/* ---------- 面板开合调度 ---------- */
function close(slot) {
  const p = openPanels.get(slot);
  if (!p) return;
  openPanels.delete(slot);
  p.close();
}
function closeAll() { for (const slot of [...openPanels.keys()]) close(slot); }

function open(slot, rowEl) {
  closeAll();
  proofPreview(slot, "");
  const done = () => { close(slot); paintTrigger(rowEl, slot); };

  if (currentVariant === "D") {
    const collapse = () => {
      region.classList.remove("fpD__region--open");
      // 过渡完成（或超时兜底）后落 rested：DOM 常驻，不再卸载
      const settle = () => { region.classList.add("fpD__region--rested"); region.setAttribute("inert", ""); };
      region.addEventListener("transitionend", (e) => { if (e.propertyName === "grid-template-rows" && !region.classList.contains("fpD__region--open")) settle(); }, { once: false });
      setTimeout(settle, 200);
    };
    const region = renderRegionD(slot, rowEl, () => { collapse(); paintTrigger(rowEl, slot); });
    rowEl.classList.add("is-open");
    region.querySelector("input").focus();
    openPanels.set(slot, { close: () => { rowEl.classList.remove("is-open"); collapse(); } });
    return;
  }

  let panel;
  const anchor = rowEl.querySelector(".fp-anchor");
  if (currentVariant === "0") panel = renderPanel0(slot, anchor, done);
  else if (currentVariant === "A") panel = renderPanelA(slot, anchor, done);
  else if (currentVariant === "B") {
    panel = renderPanelC(slot, anchor, () => { proofPreview(slot, ""); done(); }, {
      previewMode: true,
      onActive: (name) => proofPreview(slot, name),
    });
    panel.querySelector("input").addEventListener("input", () => proofPreview(slot, ""));
  } else if (currentVariant === "C") panel = renderPanelC(slot, anchor, done);

  rowEl.classList.add("is-open");
  openPanels.set(slot, {
    close: () => { panel.remove(); rowEl.classList.remove("is-open"); if (currentVariant === "B") proofPreview(slot, ""); },
  });
  panel.querySelector("input").focus();
}

/* 行渲染：label + 触发器锚点 */
const rows = [...document.querySelectorAll(".fp-row")];
for (const rowEl of rows) {
  const slot = rowEl.dataset.slot;
  rowEl.innerHTML = `<div class="settings-view__row"><span class="settings-view__label">${SLOT_LABEL[slot]}</span><div class="fp-anchor"></div></div>`;
  paintTrigger(rowEl, slot);
  rowEl.querySelector(".fp-anchor").addEventListener("click", () => {
    if (openPanels.has(slot)) close(slot);
    else open(slot, rowEl);
  });
}

/* 点面板外收浮层 */
document.addEventListener("pointerdown", (e) => {
  for (const [slot, p] of [...openPanels]) {
    const rowEl = document.querySelector(`.fp-row[data-slot="${slot}"]`);
    const inside = e.target.closest(".fp-float, .font-picker__panel, .fpD__region, .fp-anchor");
    if (!inside) p.close();
  }
});

/* ---------- 变体切换 ---------- */
const WHY = {
  "0": "现状对照：mono 小字幽灵框触发 + 320px 弹层——触发器与面板体量失衡，行内名签基线不齐。",
  A: "A · 字样卡：触发器即字面样、与行内控件同节奏；256px 面板咬合触发器，分组眉题 + 仅高亮行给样字。",
  B: "B · 简列 + 活样张：面板与 C 同款克制；悬停/高亮即在下方「样张」卡里实况预览，Enter / 双击落笔。",
  C: "C · 简列：256px 面板贴触发器下缘，34px 行距、字面名 + ✓ 选中，只留「随包」签。最轻的一版。",
  D: "D · 行内展开：不浮层——行下就地展开三列字片栅格，随文下推；展开/收起走高度过渡。",
};
function setVariant(v) {
  currentVariant = v;
  closeAll();
  for (const rowEl of rows) paintTrigger(rowEl, rowEl.dataset.slot);
  document.querySelectorAll(".switcher .pick button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.v === v))
  );
  document.getElementById("why").textContent = WHY[v];
  // 每个变体默认把「中文字体」的面板打开，置景里第一眼就是它
  const cjkRow = document.querySelector('.fp-row[data-slot="cjk"]');
  open("cjk", cjkRow);
}
document.querySelectorAll(".switcher .pick button").forEach((b) => {
  b.onclick = () => setVariant(b.dataset.v);
});

/* ---------- 主题切换 ---------- */
document.getElementById("theme-light").onclick = () => {
  document.documentElement.dataset.theme = "light";
  themeSync("light");
};
document.getElementById("theme-dark").onclick = () => {
  document.documentElement.dataset.theme = "dark";
  themeSync("dark");
};
function themeSync(t) {
  document.getElementById("theme-light").setAttribute("aria-pressed", String(t === "light"));
  document.getElementById("theme-dark").setAttribute("aria-pressed", String(t === "dark"));
}

/* URL 参数：?v=A&theme=dark */
const params = new URLSearchParams(location.search);
if (params.get("theme") === "dark") { document.documentElement.dataset.theme = "dark"; themeSync("dark"); }
setVariant(params.get("v") && WHY[params.get("v")] !== undefined ? params.get("v") : "A");

if (params.get("debug")) {
  requestAnimationFrame(() => {
    const fr = document.querySelector(".frame").getBoundingClientRect();
    const tr = document.querySelector('.fp-row[data-slot="cjk"] .fp-trigger, .fp-row[data-slot="cjk"] .font-picker__value').getBoundingClientRect();
    const panel = document.querySelector(".fp-float, .font-picker__panel");
    const pr = panel ? panel.getBoundingClientRect() : null;
    const latin = document.querySelector('.fp-row[data-slot="latin"] .fp-trigger, .fp-row[data-slot="latin"] .font-picker__value');
    const lr = latin ? latin.getBoundingClientRect() : null;
    const lcs = latin ? getComputedStyle(latin) : null;
    const pre = document.createElement("pre");
    pre.id = "rects";
    pre.textContent = JSON.stringify({
      frameTop: fr.top, frameLeft: fr.left,
      cjkTrigTop: tr.top, cjkTrigBottom: tr.bottom, cjkTrigRight: tr.right,
      panelTop: pr && pr.top, panelLeft: pr && pr.left, panelW: pr && pr.width,
      latinTop: lr && lr.top, latinW: lr && lr.width, latinH: lr && lr.height,
      latinFont: lcs && lcs.fontSize, latinVisible: latin && latin.offsetParent !== null,
      scrollTop: frameBody.scrollTop,
    });
    document.body.appendChild(pre);
  });
}
</script>
</body>
</html>
