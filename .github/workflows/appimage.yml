# 在 Ubuntu 22.04（glibc 2.35）上打 AppImage：AppImage 目录要求在最老的受支持 LTS 上构建，
# 本机 WSL 是 24.04（glibc 2.39），打出的包在旧系统上直接起不来。
name: AppImage
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 上传到哪个 Release（如 v1.13.0）
        required: true
permissions:
  contents: write
jobs:
  appimage:
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils
      - run: npm ci && npm run build
      - name: 打包（无签名私钥时结尾报签名错属预期，以产物为准）
        run: |
          # Tauri 构建时才下载 AppRun 等到 ~/.cache/tauri 且权限是 770 → 先跑一遍拉缓存，改 755 后重打包
          npm run tauri build -- --bundles appimage || true
          chmod 755 ~/.cache/tauri/*
          rm -rf src-tauri/target/release/bundle/appimage
          npm run tauri build -- --bundles appimage || true
          ls src-tauri/target/release/bundle/appimage/*.AppImage
      - name: 权限与 glibc 核对
        run: |
          f=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          bash scripts/check-appimage-perms.sh "$f"
          d=$(mktemp -d); cd "$d"; "$OLDPWD/$f" --appimage-extract >/dev/null
          max=$(objdump -T squashfs-root/usr/bin/vellum | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "vellum 需要 $max"; [ "$max" != "GLIBC_2.39" ]
      - name: 上传到 Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ inputs.tag }}" src-tauri/target/release/bundle/appimage/*.AppImage --clobber
